name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  firmware:
    # 24.04 still has GNU coreutils: 26.04 ships uutils, whose install(1)
    # thingino's CI had to swap back out.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Buildroot's host requirements, and what U-Boot's tools, pylibfdt and
      # binman build with from the host.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          bc cpio file rsync unzip
          libssl-dev python3-dev python3-pyelftools python3-setuptools swig
      - id: key
        run: echo "dl=dl-$(git rev-parse HEAD:buildroot)-${{ hashFiles('configs/k1cam_defconfig', 'package/*/*.mk', 'package/*/*.hash', 'board/k1cam/*.mk') }}" >>"$GITHUB_OUTPUT"
      # Downloads change only with a version, so they are saved per set of
      # versions; the compiler cache is saved after every build.
      - uses: actions/cache@v4
        with:
          path: dl
          key: ${{ steps.key.outputs.dl }}
          restore-keys: dl-
      - uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: k1cam-firmware
          path: |
            output/k1cam/images/k1cam.bin
            output/k1cam/images/k1cam.bin.sha256sum
            output/k1cam/images/k1cam.upd
            output/k1cam/images/k1cam.upd.sha256sum
  uvcdctl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cc: gcc
            packages: gcc libc6-dev
            runner: env
          - arch: aarch64
            cc: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
            runner: qemu-aarch64
          - arch: armv7
            cc: arm-linux-gnueabihf-gcc
            packages: gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
            runner: qemu-arm
          - arch: mipsel
            cc: mipsel-linux-gnu-gcc
            packages: gcc-mipsel-linux-gnu libc6-dev-mipsel-cross qemu-user
            runner: qemu-mipsel
    env:
      ARCH: ${{ matrix.arch }}
      CC: ${{ matrix.cc }}
      RUNNER: ${{ matrix.runner }}
    steps:
      # This build needs neither Buildroot nor its submodule.
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          binutils file ${{ matrix.packages }}
      - name: Build
        run: |
          if ! make -C package/k1cam-uvcd/uvcdctl LDFLAGS="-static -s" >uvcdctl-build.log 2>&1; then
            cat uvcdctl-build.log
            exit 1
          fi
          cat uvcdctl-build.log
      - name: Check static linking and run help
        run: |
          bin=package/k1cam-uvcd/uvcdctl/uvcdctl
          file "$bin"
          readelf -lWd "$bin" >uvcdctl-elf.txt
          if grep -E 'INTERP|NEEDED' uvcdctl-elf.txt; then
            echo "uvcdctl must have no dynamic loader or shared libraries" >&2
            exit 1
          fi
          "$RUNNER" "$bin" help
          "$RUNNER" "$bin" help firmware
      - name: Package
        run: |
          mkdir -p dist
          archive=uvcdctl-linux-$ARCH.tar.gz
          tar -czf "dist/$archive" -C package/k1cam-uvcd/uvcdctl uvcdctl
          (cd dist && sha256sum "$archive" >"$archive.sha256sum")
      - uses: actions/upload-artifact@v4
        with:
          name: uvcdctl-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  # Every push to the default branch replaces the files of one prerelease,
  # "nightly", and moves its tag, so releases/download/nightly/<file> is
  # always the newest build: no login, no zip, no expiry.
  nightly:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [firmware, uvcdctl]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: nightly
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUBJECT: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: k1cam-firmware
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: uvcdctl-linux-*
          merge-multiple: true
          path: dist
      - name: Publish
        run: |
          # A run that finishes after a newer commit's leaves nightly alone.
          head=$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME is at $head now, not $GITHUB_SHA: skipping"
            exit 0
          fi
          notes="Built from [${GITHUB_SHA::7}]($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA): ${SUBJECT%%$'\n'*}

          Replaced on every push to $GITHUB_REF_NAME. \`k1cam.upd\` is the A/B update; \`k1cam.bin\` is the whole flash, which also resets the settings.

          \`uvcdctl-linux-*.tar.gz\` contains a static Linux CLI for x86_64, aarch64 (ARM64), armv7 (32-bit hard-float ARM) or mipsel (32-bit little-endian MIPS). Extract it and run \`./uvcdctl help\`."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/* --clobber
          else
            gh release create nightly dist/* --prerelease --title nightly --target "$GITHUB_SHA" --notes "$notes"
          fi
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null ||
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          gh release edit nightly --notes "$notes"
